# crates/sgida-identity/Cargo.toml
[package]
name = "sgida-identity"
version = "0.1.0"
edition = "2021"

[dependencies]
sgida-ports = { path = "../sgida-ports" }
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
uuid = { version = "1" }
hkdf = "0.12"
sha2 = "0.10"
secrecy = "0.8"
thiserror = "1"
toml = "0.8"
dashmap = "5"

[dev-dependencies]
proptest = "1"
